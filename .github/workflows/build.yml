name: Build SAMP Mobile 2.11.325 APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses & Install SDK/NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Clarity
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/*.apk release-artifacts/SAMP-Mobile-2.11.325-4king.apk || cp app/build/outputs/apk/debug/*.apk release-artifacts/ || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-2.11.325-Debug-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "SAMP Mobile v2.11.325 (4King Native UI Edition)"
          body: |
            ### 🚀 SAMP Mobile 2.11.325
            - **Server IP**: `82.26.104.84:7777`
            - **Native Server-side UI**: Cleaned client ImGui overlay in favor of Pawno native Dialogs & GTA SA in-game objects/textdraws.
          files: release-artifacts/*.apk
